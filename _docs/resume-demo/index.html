  }
  .btn:hover { filter: brightness(0.92); }
  .btn:focus { outline: 2px solid rgb(var(--p) / 0.4); outline-offset: 2px; }

  .select {
    display: inline-flex; align-items: center;

        <option disabled value="">主题</option>
        <option v-for="t in themes" :key="t" :value="t">{{ t }}</option>
      </select>
    </div>
  </header>

  <!-- 主体简历 -->
  <main>
    <div class="text-sm md:text-base print:text-base container mx-auto max-w-screen-xl text-left">
      <main
        id="resume-wrapper"
        ref="mainEl"
        :contenteditable="isContenteditable"
        class="flex flex-col  shadow-2xl print:shadow-none"

          <div class="main-content">
            <div class="flex flex-col rounded">
              <div
                v-for="(item, index) in components"
                :key="item.id"
                :class="['block-item', dragOverIndex === index ? 'drag-over' : '', draggingIndex === index ? 'dragging' : '']"
                @dragover.prevent="onDragOver(index, $event)"
                @dragleave="onDragLeave(index)"
                @drop.prevent="onDrop(index, $event)"
              >
                <component
                  :is="item.component"
                  v-bind="item.props"
                  @drag-title-start="onDragStartFromTitle(index, $event)"
                ></component>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </main>

  <div class="xl gray4 justify-center m-5 flex gap3 print:hidden"></div>

  <guided-modal v-if="showGuidedModal" :open="showGuidedModal" @close="showGuidedModal = false"></guided-modal>

const GuidedModal = {
  name: 'GuidedModal',
  props: { open: { type: Boolean, default: false } },
  watch: {
    open(val) {
      this.$nextTick(() => {
        if (val && this.$refs.modal) {
          if (!this.$refs.modal.open) this.$refs.modal.showModal();
        }
      });
    },
  },
  mounted() {
    if (this.open && this.$refs.modal) this.$refs.modal.showModal();
  },
  template: `
    <dialog ref="modal" class="modal" @close="$emit('close')">
      <div class="modal-box sm:max-w-5xl">
        <h3 class="font-bold text-lg">
          使用说明

        <div class="p-5">
          <ul class="list-disc">

            <li>打印时有问题请按下面的视频操作调整浏览器的打印配置</li>
          </ul>

  `,
};

/* ---------- 根实例 ---------- */

  el: '#app',
  components: {
    profile: Profile,
    experiences: Experiences,
    skills: Skills,
    educations: Educations,
    'personal-projects': PersonalProjects,
    guided: Guided,
    'guided-modal': GuidedModal,
  },
  data() {
    return {
      theme: 'fantasy',
      themes: [
        'light', 'bumblebee', 'emerald', 'lofi', 'pastel',
        'fantasy', 'wireframe', 'cmyk', 'lemonade', 'winter',
      ],
      isContenteditable: false,
      showGuidedModal: false,
      data: resumeData,
      // 组件顺序（沿用原项目 pages/index.vue 的 4 个 section）
      components: [
        { id: 1, component: 'experiences',    props: { experiences: resumeData.experiences } },
        { id: 2, component: 'skills',         props: { skills: resumeData.skills } },
        { id: 3, component: 'educations',     props: { educations: resumeData.educations } },
        { id: 4, component: 'personal-projects', props: { personalProjects: resumeData.personalProjects } },
      ],
      // 拖拽状态
      draggingIndex: null,
      dragOverIndex: null,
      // 长按门槛（贴合 :delay="60"）
      dragPressTimer: null,
      dragPressTriggered: false,
    };
  },
  // 沿用原 composables/edit.ts 的语义：isContenteditable 用 ref 全局共享
  // Vue 2 用 provide/inject 实现，所有子组件可读取
  provide() {
    return {
      isContenteditable: () => this.isContenteditable,
    };
  },
  watch: {
    theme(val) {
      document.documentElement.setAttribute('data-theme', val);
    },
  },
  mounted() {
    document.documentElement.setAttribute('data-theme', this.theme);
  },
  methods: {
    handlePrint() {
      window.print();
    },
    handleToggleContentEditable() {
      this.isContenteditable = !this.isContenteditable;
      if (this.isContenteditable) {
        this.$nextTick(() => {
          const el = document.getElementById('resume-wrapper');
          if (el) el.focus();
        });
      }
    },
    handleEdit() {
      if (this.isContenteditable) return;
      this.isContenteditable = true;
      this.$nextTick(() => {
        const el = document.getElementById('resume-wrapper');
        if (el) el.focus();
      });
    },
    handleBlur(evt) {
      // avoid click toggle-button bug（沿用原 pages/index.vue handleBlur）
      if (evt && evt.relatedTarget && evt.relatedTarget.id === 'toggle-contenteditable') return;
      this.isContenteditable = false;
    },
    /* ===== 拖拽（HTML5 native，贴合 VueDraggable handle=".handle" delay=60） ===== */
    onDragStartFromTitle(index, evt) {
      if (this.isContenteditable) { evt.preventDefault(); return; }
      // 子组件在 h2 标题上 dragstart，dataTransfer 需要在同步流程内 setData
      // 否则部分浏览器会拒绝后续 drop
      this.draggingIndex = index;
      evt.dataTransfer.effectAllowed = 'move';
      try { evt.dataTransfer.setData('text/plain', String(index)); } catch (e) { /* ignore */ }
    },
    onDragOver(index, evt) {
      if (this.draggingIndex === null) return;
      this.dragOverIndex = index;
      if (evt.dataTransfer) evt.dataTransfer.dropEffect = 'move';
    },
    onDragLeave(index) {
      if (this.dragOverIndex === index) this.dragOverIndex = null;
    },
    onDrop(targetIndex /*, evt */) {
      if (this.draggingIndex === null) return;
      const from = this.draggingIndex;
      const to = targetIndex;
      if (from !== to) {
        const arr = this.components.slice();
        const [moved] = arr.splice(from, 1);
        arr.splice(to, 0, moved);
        this.components = arr;
      }
      this.draggingIndex = null;
      this.dragOverIndex = null;
    },
  },
});
</script>
